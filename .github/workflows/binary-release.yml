name: Publish release binaries

on:
  workflow_call:
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true

permissions:
  contents: write

jobs:
  release-policy:
    permissions:
      contents: read
    uses: ./.github/workflows/release-policy.yml

  binary-release-linux:
    needs: release-policy
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            cc: gcc
            asset_arch: amd64
          - goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            asset_arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          check-latest: true
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential gcc-aarch64-linux-gnu

      - name: Install frontend dependencies
        run: npm --prefix ./web ci

      - name: Build frontend
        run: npm --prefix ./web run build

      - name: Build binary package
        env:
          VERSION: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          set -euo pipefail
          package_name="cpa-usage-keeper_${VERSION}_${GOOS}_${ASSET_ARCH}"
          package_dir="dist/${package_name}"
          mkdir -p "${package_dir}/data"

          CGO_ENABLED=1 GOOS="${GOOS}" GOARCH="${GOARCH}" CC="${CC}" \
            go build -trimpath -ldflags="-s -w -X cpa-usage-keeper/internal/version.Version=${VERSION}" -o "${package_dir}/cpa-usage-keeper" ./cmd/server/main.go
          cp .env.example README.md README.zh.md LICENSE "${package_dir}/"
          cp -R docs "${package_dir}/"
          cp deploy/cpa-usage-keeper.example.service "${package_dir}/cpa-usage-keeper.service"
          tar -czf "dist/${package_name}.tar.gz" -C dist "${package_name}"

      - name: Upload binary package artifact
        uses: actions/upload-artifact@v6
        with:
          name: cpa-usage-keeper-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.asset_arch }}
          path: dist/cpa-usage-keeper_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.asset_arch }}.tar.gz
          if-no-files-found: error

  binary-release-darwin:
    needs: release-policy
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            asset_arch: amd64
            runs_on: macos-15-intel
          - goos: darwin
            goarch: arm64
            asset_arch: arm64
            runs_on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          check-latest: true
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix ./web ci

      - name: Build frontend
        run: npm --prefix ./web run build

      - name: Build binary package
        env:
          VERSION: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          set -euo pipefail
          package_name="cpa-usage-keeper_${VERSION}_${GOOS}_${ASSET_ARCH}"
          package_dir="dist/${package_name}"
          mkdir -p "${package_dir}/data"

          CGO_ENABLED=1 GOOS="${GOOS}" GOARCH="${GOARCH}" \
            go build -trimpath -ldflags="-s -w -X cpa-usage-keeper/internal/version.Version=${VERSION}" -o "${package_dir}/cpa-usage-keeper" ./cmd/server/main.go
          cp .env.example README.md README.zh.md LICENSE "${package_dir}/"
          cp -R docs "${package_dir}/"
          tar -czf "dist/${package_name}.tar.gz" -C dist "${package_name}"

      - name: Upload binary package artifact
        uses: actions/upload-artifact@v6
        with:
          name: cpa-usage-keeper-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.asset_arch }}
          path: dist/cpa-usage-keeper_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.asset_arch }}.tar.gz
          if-no-files-found: error

  binary-release-windows:
    needs: release-policy
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            asset_arch: amd64
            runs_on: windows-2025
            msystem: UCRT64
            install: mingw-w64-ucrt-x86_64-gcc
            cc: gcc
          - goarch: arm64
            asset_arch: arm64
            runs_on: windows-11-arm
            msystem: CLANGARM64
            install: mingw-w64-clang-aarch64-gcc
            cc: gcc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          check-latest: true
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          path-type: inherit
          install: ${{ matrix.install }}

      - name: Install frontend dependencies
        shell: bash
        run: npm --prefix ./web ci

      - name: Build frontend
        shell: bash
        run: npm --prefix ./web run build

      - name: Build binary package
        shell: msys2 {0}
        env:
          VERSION: ${{ github.ref_name }}
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          package_name="cpa-usage-keeper_${VERSION}_${GOOS}_${ASSET_ARCH}"
          package_dir="dist/${package_name}"
          mkdir -p "${package_dir}/data"

          CGO_ENABLED=1 GOOS="${GOOS}" GOARCH="${GOARCH}" CC="${CC}" \
            go build -trimpath -ldflags="-s -w -X cpa-usage-keeper/internal/version.Version=${VERSION}" -o "${package_dir}/cpa-usage-keeper.exe" ./cmd/server/main.go
          cp .env.example README.md README.zh.md LICENSE "${package_dir}/"
          cp -R docs "${package_dir}/"

      - name: Archive binary package
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          $packageName = "cpa-usage-keeper_${env:VERSION}_windows_${env:ASSET_ARCH}"
          Compress-Archive -Path "dist/$packageName" -DestinationPath "dist/$packageName.zip"

      - name: Upload binary package artifact
        uses: actions/upload-artifact@v6
        with:
          name: cpa-usage-keeper-${{ github.ref_name }}-windows-${{ matrix.asset_arch }}
          path: dist/cpa-usage-keeper_${{ github.ref_name }}_windows_${{ matrix.asset_arch }}.zip
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-26.04
    needs:
      - release-policy
      - binary-release-linux
      - binary-release-darwin
      - binary-release-windows
    steps:
      - name: Download binary package artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cpa-usage-keeper-${{ github.ref_name }}-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt

      - name: Generate release version file
        id: version_file
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" =~ ^v2\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf '%s\n' "$RELEASE_TAG" > dist/version.txt
            echo 'path=dist/version.txt' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          make_latest: ${{ needs.release-policy.outputs.latest }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            ${{ steps.version_file.outputs.path }}

  update-homebrew-tap:
    runs-on: ubuntu-26.04
    needs: [release-policy, publish-release]
    steps:
      - name: Download binary package artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cpa-usage-keeper-${{ github.ref_name }}-*
          path: dist
          merge-multiple: true

      - name: Generate Homebrew formula values
        id: formula
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt

          arm_file="cpa-usage-keeper_${tag}_darwin_arm64.tar.gz"
          amd_file="cpa-usage-keeper_${tag}_darwin_amd64.tar.gz"
          arm_sha="$(awk -v f="${arm_file}" '$2 == f {print $1}' checksums.txt)"
          amd_sha="$(awk -v f="${amd_file}" '$2 == f {print $1}' checksums.txt)"

          test -n "${arm_sha}"
          test -n "${amd_sha}"

          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "arm_file=${arm_file}"
            echo "amd_file=${amd_file}"
            echo "arm_sha=${arm_sha}"
            echo "amd_sha=${amd_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: Willxup/homebrew-cpa-usage-keeper
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        shell: bash
        env:
          FORMULA: ${{ needs.release-policy.outputs.formula }}
          TAG: ${{ steps.formula.outputs.tag }}
          VERSION: ${{ steps.formula.outputs.version }}
          ARM_FILE: ${{ steps.formula.outputs.arm_file }}
          AMD_FILE: ${{ steps.formula.outputs.amd_file }}
          ARM_SHA: ${{ steps.formula.outputs.arm_sha }}
          AMD_SHA: ${{ steps.formula.outputs.amd_sha }}
        run: |
          set -euo pipefail
          # Preserve the tap's installation, service and configuration settings.
          # Only the selected formula's release metadata is updated.
          python3 - <<'PYTHON'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          formula = os.environ["FORMULA"]
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version) or tag != f"v{version}":
              raise SystemExit("Invalid stable release version")
          expected_formula = "cpa-usage-keeper@1" if version.split(".")[0] == "1" else "cpa-usage-keeper"
          if formula != expected_formula:
              raise SystemExit("Formula does not match the release major version")

          path = Path("homebrew-tap/Formula") / f"{formula}.rb"
          content = path.read_text()
          content, count = re.subn(r'(?m)^([ \t]*version ")[^"]+("[ \t]*)$', lambda m: f'{m[1]}{version}{m[2]}', content)
          if count != 1:
              raise SystemExit("Expected exactly one formula version")

          for arch, prefix in (("arm64", "ARM"), ("amd64", "AMD")):
              filename = os.environ[f"{prefix}_FILE"]
              checksum = os.environ[f"{prefix}_SHA"]
              if filename != f"cpa-usage-keeper_{tag}_darwin_{arch}.tar.gz" or not re.fullmatch(r"[0-9a-f]{64}", checksum):
                  raise SystemExit(f"Invalid {arch} release metadata")
              url = f"https://github.com/Willxup/cpa-usage-keeper/releases/download/{tag}/{filename}"
              pattern = (
                  r'(?m)^([ \t]*url ")https://github\.com/Willxup/cpa-usage-keeper/releases/download/'
                  rf'[^/"\n]+/cpa-usage-keeper_[^/"\n]+_darwin_{arch}\.tar\.gz'
                  r'("[ \t]*\n[ \t]*sha256 ")[0-9a-f]{64}("[ \t]*)$'
              )
              content, count = re.subn(pattern, lambda m: f'{m[1]}{url}{m[2]}{checksum}{m[3]}', content)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {arch} URL and checksum")

          path.write_text(content, encoding="utf-8", newline="\n")
          PYTHON

      - name: Commit and push tap update
        shell: bash
        working-directory: homebrew-tap
        env:
          FORMULA: ${{ needs.release-policy.outputs.formula }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "Formula/${FORMULA}.rb"
          if git diff --cached --quiet; then
            echo "Homebrew formula already up to date"
            exit 0
          fi

          git commit -m "Update ${FORMULA} to ${GITHUB_REF_NAME}"
          git push origin HEAD:main
